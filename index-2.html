<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="All 20 B.Sc. 1st Semester C Programming Lab programs in one mobile-friendly page, each with a copy button.">
<title>C Programming Lab — 20 Programs</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--panel2:#17243a;--text:#f1f5f9;--muted:#a7b4c7;--line:#293950;--accent:#7dd3fc;--good:#86efac}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172640 0,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:auto;padding:20px 14px 44px}.hero{padding:20px 4px 16px}.tag{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;margin:9px 0}.hero p{color:var(--muted);margin:8px 0 0}.count{display:inline-flex;align-items:center;border:1px solid var(--line);background:#0c1627;border-radius:99px;padding:5px 10px;color:var(--accent);font-size:.86rem;margin-top:14px}
.tools{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.94);backdrop-filter:blur(12px);padding:10px 0 12px;display:flex;gap:8px;flex-wrap:wrap}.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px 14px;font-size:1rem;outline:none}.search:focus{border-color:var(--accent)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--panel2);color:var(--text);font-weight:700}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#082032;border-color:transparent}.list{display:grid;gap:10px}.program{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(17,28,46,.94)}.program[hidden]{display:none}.head{display:flex;align-items:center;gap:10px;padding:13px}.num{flex:none;width:36px;height:36px;border-radius:10px;background:#21334c;color:var(--accent);display:grid;place-items:center;font-weight:900}.heading{flex:1;min-width:0}.heading h2{margin:0;font-size:1rem;line-height:1.35}.heading small{display:block;color:var(--muted);margin-top:3px}.expand{flex:none;padding:8px 10px}.codearea{border-top:1px solid var(--line);padding:12px}.codeactions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;color:var(--muted);font-size:.82rem}.code{margin:0;max-height:none;overflow:auto;border-radius:10px;background:#070d17;border:1px solid #1b2a3e;padding:14px;color:#d8e7f7;font: .88rem/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;tab-size:4;-webkit-overflow-scrolling:touch}.foot{color:var(--muted);font-size:.83rem;text-align:center;padding:24px 4px 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--good);color:#092015;font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:0 8px 30px #0008;display:none;z-index:20}.toast.show{display:block}.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
@media(min-width:680px){.wrap{padding-top:32px}.head{padding:15px}.heading h2{font-size:1.05rem}.code{font-size:.9rem}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="tag">B.Sc. 1st Semester · RNEP-2026</div>
    <h1>C Programming Lab</h1>
    <p>All 20 programs in one place. Open a program, copy its code, and paste it into your C compiler.</p>
    <div class="count">20 programs · Mobile friendly</div>
  </header>
  <section class="tools" aria-label="Program tools">
    <input class="search" id="search" type="search" placeholder="Search programs…" aria-label="Search programs">
    <button id="expandAll">Open all</button>
    <button class="primary" id="copyAll">Copy all code</button>
  </section>
  <section id="list" class="list" aria-label="All C programs"></section>
  <div id="empty" class="empty" hidden>No matching programs. Try another search.</div>
  <footer class="foot">Program reference: C Programming Lab Manual · Use each code block separately.</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const programs = [{"number": 1, "title": "Area of Circle and Triangle", "filename": "01_area_circle_triangle.c", "code": "#include <stdio.h>\n#include <math.h>\n\n#define PI 3.142\n\nint main()\n{\n    float r, ac, at, a, b, c, s;\n\n    printf(\"Radius: \");\n    scanf(\"%f\", &r);\n\n    ac = PI * r * r;\n    printf(\"Area of the circle = %.2f\\n\", ac);\n\n    printf(\"\\nEnter side1: \");\n    scanf(\"%f\", &a);\n    printf(\"Enter side2: \");\n    scanf(\"%f\", &b);\n    printf(\"Enter side3: \");\n    scanf(\"%f\", &c);\n\n    s = (a + b + c) / 2;\n    at = sqrt(s * (s - a) * (s - b) * (s - c));\n\n    printf(\"\\nArea of the triangle = %.2f\\n\", at);\n    return 0;\n}\n"}, {"number": 2, "title": "Largest of Three Numbers", "filename": "02_largest_of_three.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int a, b, c;\n\n    printf(\"First number: \");\n    scanf(\"%d\", &a);\n    printf(\"Second number: \");\n    scanf(\"%d\", &b);\n    printf(\"Third number: \");\n    scanf(\"%d\", &c);\n\n    if (a >= b && a >= c)\n        printf(\"%d is largest\", a);\n    else if (b >= a && b >= c)\n        printf(\"%d is largest\", b);\n    else\n        printf(\"%d is largest\", c);\n\n    return 0;\n}\n"}, {"number": 3, "title": "Reverse the Digits of an Integer", "filename": "03_reverse_digits.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int n, r, rev = 0;\n\n    printf(\"Enter an integer: \");\n    scanf(\"%d\", &n);\n\n    while (n > 0)\n    {\n        r = n % 10;\n        rev = rev * 10 + r;\n        n = n / 10;\n    }\n\n    printf(\"Reversed digits are: %d\", rev);\n    return 0;\n}\n"}, {"number": 4, "title": "GCD / HCF of Two Numbers", "filename": "04_gcd_two_numbers.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int a, b, H;\n\n    printf(\"Enter two numbers: \");\n    scanf(\"%d %d\", &a, &b);\n\n    for (H = (a < b ? a : b); H >= 1; H--)\n    {\n        if (a % H == 0 && b % H == 0)\n            break;\n    }\n\n    printf(\"HCF %d\", H);\n    return 0;\n}\n"}, {"number": 5, "title": "Generate N Prime Numbers", "filename": "05_generate_prime_numbers.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int N, x = 2, i;\n\n    printf(\"Enter how many prime numbers: \");\n    scanf(\"%d\", &N);\n\n    while (N > 0)\n    {\n        for (i = 2; i < x; i++)\n        {\n            if (x % i == 0)\n                break;\n        }\n\n        if (i == x)\n        {\n            printf(\"%d \", x);\n            N--;\n        }\n        x++;\n    }\n\n    return 0;\n}\n"}, {"number": 6, "title": "Compute the nth Fibonacci Number", "filename": "06_nth_fibonacci.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int term, f1 = 0, f2 = 1, f3 = 0, c;\n\n    printf(\"Which term? \");\n    scanf(\"%d\", &term);\n\n    for (c = 1; c < term; c++)\n    {\n        f1 = f2;\n        f2 = f3;\n        f3 = f1 + f2;\n    }\n\n    printf(\"Fibonacci number is: %d\", f3);\n    return 0;\n}\n"}, {"number": 7, "title": "Find Even or Odd Number", "filename": "07_even_or_odd.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int n, r;\n\n    printf(\"Enter a number: \");\n    scanf(\"%d\", &n);\n\n    r = n % 2;\n\n    if (r == 0)\n        printf(\"%d is even number\", n);\n    else\n        printf(\"%d is odd number\", n);\n\n    return 0;\n}\n"}, {"number": 8, "title": "Exchange Two Variables", "filename": "08_swap_two_variables.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int a, b;\n\n    printf(\"a = \");\n    scanf(\"%d\", &a);\n    printf(\"b = \");\n    scanf(\"%d\", &b);\n\n    printf(\"Values before exchanging\\na = %d\\\\tb = %d\", a, b);\n\n    a = a + b;\n    b = a - b;\n    a = a - b;\n\n    printf(\"\\nValues after exchanging\\na = %d\\\\tb = %d\", a, b);\n    return 0;\n}\n"}, {"number": 9, "title": "Numbers from 100 to 200 Divisible by 7; Sum and Count", "filename": "09_divisible_by_7_sum_count.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int n1, count = 0, sum = 0, r;\n\n    printf(\"Numbers from 100 to 200 divisible by 7\");\n\n    for (n1 = 100; n1 <= 200; n1++)\n    {\n        r = n1 % 7;\n        if (r == 0)\n        {\n            printf(\"\\n%d\", n1);\n            count++;\n            sum = sum + n1;\n        }\n    }\n\n    printf(\"\\nCount = %d\", count);\n    printf(\"\\nSum = %d\", sum);\n    return 0;\n}\n"}, {"number": 10, "title": "Summation of a Set of Numbers", "filename": "10_sum_of_numbers.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int n, m, c, sum = 0;\n\n    printf(\"How many numbers? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d numbers one by one\\n\", n);\n    for (c = 1; c <= n; c++)\n    {\n        scanf(\"%d\", &m);\n        sum = sum + m;\n    }\n\n    printf(\"Sum of all the numbers = %d\", sum);\n    return 0;\n}\n"}, {"number": 11, "title": "Factorial Computation", "filename": "11_factorial.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int n;\n    long int f = 1;\n\n    printf(\"Enter a number: \");\n    scanf(\"%d\", &n);\n\n    while (n > 0)\n    {\n        f = f * n;\n        n = n - 1;\n    }\n\n    printf(\"Factorial = %ld\", f);\n    return 0;\n}\n"}, {"number": 12, "title": "Fibonacci Sequence up to N", "filename": "12_fibonacci_up_to_n.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int n, f1 = 0, f2 = 1, f3 = 0;\n\n    printf(\"Enter the last number: \");\n    scanf(\"%d\", &n);\n\n    while (f3 <= n)\n    {\n        printf(\"%5d\", f3);\n        f1 = f2;\n        f2 = f3;\n        f3 = f1 + f2;\n    }\n\n    return 0;\n}\n"}, {"number": 13, "title": "Reverse the Order of an Array", "filename": "13_reverse_array.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int arr[100], i, n;\n\n    printf(\"How many elements? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d numbers\\n\", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &arr[i]);\n\n    printf(\"Original array is\\n\");\n    for (i = 0; i < n; i++)\n        printf(\"%5d\", arr[i]);\n\n    printf(\"\\nArray after reversal\\n\");\n    for (i = n - 1; i >= 0; i--)\n        printf(\"%5d\", arr[i]);\n\n    return 0;\n}\n"}, {"number": 14, "title": "Maximum Number in a Set", "filename": "14_maximum_in_set.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int arr[100], i, n, max;\n\n    printf(\"How many elements? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d numbers\\n\", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &arr[i]);\n\n    max = arr[0];\n    for (i = 1; i < n; i++)\n    {\n        if (arr[i] > max)\n            max = arr[i];\n    }\n\n    printf(\"Maximum number = %d\", max);\n    return 0;\n}\n"}, {"number": 15, "title": "Remove Duplicates from an Array", "filename": "15_remove_duplicates.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int arr1[100], arr2[100], i, j, n, found, k = 0;\n\n    printf(\"How many numbers? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d numbers\\n\", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &arr1[i]);\n\n    for (i = 0; i < n; i++)\n        arr2[i] = -9999;\n\n    printf(\"Array before removing duplicates\\n\");\n    for (i = 0; i < n; i++)\n        printf(\"%5d\", arr1[i]);\n\n    for (i = 0; i < n; i++)\n    {\n        found = 1;\n        for (j = 0; j < n; j++)\n        {\n            if (arr1[i] == arr2[j])\n            {\n                found = 0;\n                break;\n            }\n        }\n\n        if (found == 1)\n        {\n            arr2[k] = arr1[i];\n            k++;\n        }\n    }\n\n    printf(\"\\nArray after removing duplicates\\n\");\n    for (i = 0; i < k; i++)\n        printf(\"%5d\", arr2[i]);\n\n    return 0;\n}\n"}, {"number": 16, "title": "Partition an Array", "filename": "16_partition_array.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int arr1[100], arr2[100], arr3[100], i, n, mid;\n\n    printf(\"How many elements? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d elements\\n\", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &arr1[i]);\n\n    mid = n / 2;\n\n    for (i = 0; i < mid; i++)\n        arr2[i] = arr1[i];\n\n    for (i = mid; i < n; i++)\n        arr3[i - mid] = arr1[i];\n\n    printf(\"Array before partitioning\\n\");\n    for (i = 0; i < n; i++)\n        printf(\"%5d\", arr1[i]);\n\n    printf(\"\\nArray-1\\n\");\n    for (i = 0; i < mid; i++)\n        printf(\"%5d\", arr2[i]);\n\n    printf(\"\\nArray-2\\n\");\n    for (i = 0; i < n - mid; i++)\n        printf(\"%5d\", arr3[i]);\n\n    printf(\"\\n\");\n    return 0;\n}\n"}, {"number": 17, "title": "Minimum Number in a Set", "filename": "17_minimum_in_set.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int arr[100], i, n, min;\n\n    printf(\"How many elements? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d numbers\\n\", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &arr[i]);\n\n    min = arr[0];\n    for (i = 1; i < n; i++)\n    {\n        if (arr[i] < min)\n            min = arr[i];\n    }\n\n    printf(\"Minimum number = %d\\n\", min);\n    return 0;\n}\n"}, {"number": 18, "title": "Count Students Who Passed and Failed", "filename": "18_pass_fail_students.c", "code": "#include <stdio.h>\n\nint main()\n{\n    int marks, i, passed = 0, failed = 0, n;\n\n    printf(\"How many students? \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter the marks of %d students\\n\", n);\n    for (i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &marks);\n        if (marks >= 40)\n            passed++;\n        else\n            failed++;\n    }\n\n    printf(\"Number of students passed = %d\", passed);\n    printf(\"\\nNumber of students failed = %d\\n\", failed);\n    return 0;\n}\n"}, {"number": 19, "title": "Count Vowels, Consonants and Special Characters", "filename": "19_count_vowels_consonants_special.c", "code": "#include <stdio.h>\n#include <ctype.h>\n\nint main()\n{\n    char sent[100], ch;\n    int i, v = 0, c = 0, sp = 0;\n\n    printf(\"Enter a sentence\\n\");\n    fgets(sent, sizeof(sent), stdin);\n\n    for (i = 0; sent[i] != '\\0' && sent[i] != '\\n'; i++)\n    {\n        ch = toupper((unsigned char)sent[i]);\n\n        if (ch >= 'A' && ch <= 'Z')\n        {\n            if (ch == 'A' || ch == 'E' || ch == 'I' ||\n                ch == 'O' || ch == 'U')\n                v++;\n            else\n                c++;\n        }\n        else if ((ch < '0' || ch > '9') && sent[i] != ' ')\n        {\n            sp++;\n        }\n    }\n\n    printf(\"Vowels = %d\", v);\n    printf(\"\\nConsonants = %d\", c);\n    printf(\"\\nSpecial character = %d\\n\", sp);\n    return 0;\n}\n"}, {"number": 20, "title": "Add and Subtract Two Matrices Using Functions", "filename": "20_matrix_add_subtract_functions.c", "code": "#include <stdio.h>\n\nvoid read_arr(int a[10][10], int row, int col)\n{\n    int i, j;\n    for (i = 0; i < row; i++)\n    {\n        for (j = 0; j < col; j++)\n        {\n            printf(\"Enter element %d %d: \", i + 1, j + 1);\n            scanf(\"%d\", &a[i][j]);\n        }\n    }\n}\n\nvoid add_arr(int m1[10][10], int m2[10][10], int m3[10][10], int row, int col)\n{\n    int i, j;\n    for (i = 0; i < row; i++)\n        for (j = 0; j < col; j++)\n            m3[i][j] = m1[i][j] + m2[i][j];\n}\n\nvoid sub_arr(int m1[10][10], int m2[10][10], int m4[10][10], int row, int col)\n{\n    int i, j;\n    for (i = 0; i < row; i++)\n        for (j = 0; j < col; j++)\n            m4[i][j] = m1[i][j] - m2[i][j];\n}\n\nvoid print_arr(int m[10][10], int row, int col)\n{\n    int i, j;\n    for (i = 0; i < row; i++)\n    {\n        for (j = 0; j < col; j++)\n            printf(\"%5d\", m[i][j]);\n        printf(\"\\n\");\n    }\n}\n\nint main()\n{\n    int m1[10][10], m2[10][10], m3[10][10], m4[10][10];\n    int row, col;\n\n    printf(\"Number of rows: \");\n    scanf(\"%d\", &row);\n    printf(\"Number of columns: \");\n    scanf(\"%d\", &col);\n\n    if (row < 1 || row > 10 || col < 1 || col > 10)\n    {\n        printf(\"Rows and columns must be from 1 to 10.\\n\");\n        return 1;\n    }\n\n    printf(\"Enter the elements of matrix1\\n\");\n    read_arr(m1, row, col);\n    printf(\"Enter the elements of matrix2\\n\");\n    read_arr(m2, row, col);\n\n    add_arr(m1, m2, m3, row, col);\n    sub_arr(m1, m2, m4, row, col);\n\n    printf(\"Addition of two matrices\\n\");\n    print_arr(m3, row, col);\n    printf(\"Subtraction of two matrices\\n\");\n    print_arr(m4, row, col);\n\n    return 0;\n}\n"}];
const list=document.getElementById('list'), search=document.getElementById('search'), toast=document.getElementById('toast');
const cards=[]; let toastTimer;
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
async function copyText(value){try{await navigator.clipboard.writeText(value);notify('Copied to clipboard ✓')}catch(e){const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');notify('Copied to clipboard ✓')}catch(err){notify('Select and copy the code manually')}ta.remove()}}
programs.forEach(p=>{
 const el=document.createElement('article');el.className='program';el.dataset.search=(p.title+' '+p.filename+' '+p.number).toLowerCase();
 const head=document.createElement('div');head.className='head';
 const num=document.createElement('div');num.className='num';num.textContent=String(p.number).padStart(2,'0');
 const heading=document.createElement('div');heading.className='heading';const h=document.createElement('h2');h.textContent=p.title;const small=document.createElement('small');small.textContent=p.filename;heading.append(h,small);
 const expand=document.createElement('button');expand.className='expand';expand.textContent='View code';expand.setAttribute('aria-expanded','false');
 const area=document.createElement('div');area.className='codearea';area.hidden=true;
 const actions=document.createElement('div');actions.className='codeactions';const lang=document.createElement('span');lang.textContent='C source code';const cp=document.createElement('button');cp.className='primary';cp.textContent='Copy this program';cp.addEventListener('click',()=>copyText(p.code));actions.append(lang,cp);
 const pre=document.createElement('pre');pre.className='code';const code=document.createElement('code');code.textContent=p.code;pre.appendChild(code);area.append(actions,pre);
 expand.addEventListener('click',()=>{area.hidden=!area.hidden;expand.textContent=area.hidden?'View code':'Hide code';expand.setAttribute('aria-expanded',String(!area.hidden))});
 head.append(num,heading,expand);el.append(head,area);list.append(el);cards.push({el,area,expand,p});
});
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let shown=0;cards.forEach(c=>{const match=c.el.dataset.search.includes(q);c.el.hidden=!match;if(match)shown++});document.getElementById('empty').hidden=shown!==0});
document.getElementById('expandAll').addEventListener('click',()=>{const shouldOpen=cards.some(c=>!c.el.hidden&&c.area.hidden);cards.forEach(c=>{if(!c.el.hidden){c.area.hidden=!shouldOpen;c.expand.textContent=shouldOpen?'Hide code':'View code';c.expand.setAttribute('aria-expanded',String(shouldOpen))}});document.getElementById('expandAll').textContent=shouldOpen?'Close all':'Open all'});
document.getElementById('copyAll').addEventListener('click',()=>copyText(programs.map(p=>'/* PROGRAM '+p.number+': '+p.title+' */\n'+p.code.trim()).join('\n\n'+'='.repeat(56)+'\n\n')));
</script>
</body>
</html>
